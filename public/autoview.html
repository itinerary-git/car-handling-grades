<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오토뷰 등급 입력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F3F5F4; --surface:#FFFFFF; --ink:#16201C; --muted:#56645E; --line:#D3DCD8;
  --accent:#0E7A68; --accent-soft:#DDEFEA; --warn:#D9520B; --av:#1F5FBF; --av-soft:#E3ECFA;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#101614; --surface:#17201D; --ink:#E4EBE8; --muted:#94A39D; --line:#2B3632;
    --accent:#35BFA3; --accent-soft:#16312B; --warn:#FF7B3A; --av:#7FA8F0; --av-soft:#1A2640;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#101614; --surface:#17201D; --ink:#E4EBE8; --muted:#94A39D; --line:#2B3632;
  --accent:#35BFA3; --accent-soft:#16312B; --warn:#FF7B3A; --av:#7FA8F0; --av-soft:#1A2640;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.55;padding-inline:16px;padding-block:24px 56px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:20px}
.back{font-family:var(--mono);font-size:12px;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1.05;margin:4px 0 0}
.lede{color:var(--muted);max-width:70ch;margin:8px 0 0}
.scale{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-family:var(--mono);font-size:11.5px}
.scale span{padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:10px;max-width:520px}
.gate form{display:flex;gap:8px;flex-wrap:wrap}
.gate input{flex:1 1 220px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit}
.gate button{padding:8px 14px;border:0;border-radius:6px;background:var(--av);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.gate .err{color:var(--warn);font-size:13px;min-height:1em;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding-block:10px;z-index:2;border-bottom:1px solid var(--line)}
.bar input[type=search]{flex:1 1 240px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit}
.bar label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
.status{font-family:var(--mono);font-size:12px}
.status.off{color:var(--warn)}
ul.list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.row.done{border-color:var(--av);box-shadow:inset 3px 0 0 var(--av)}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .src{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.meta a{color:var(--av);text-underline-offset:2px}
.hint{font-family:var(--body);font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.split{font-family:var(--body);font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--av-soft);color:var(--av);font-weight:600}
.pick{display:grid;grid-template-columns:auto auto;gap:6px 8px;align-items:center;font-size:12.5px}
.pick label{color:var(--muted);text-align:right}
.pick select{font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:9.5em}
.saved{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--av);min-height:1em}
@media (max-width:640px){.row{grid-template-columns:1fr}.pick{grid-template-columns:auto 1fr}.pick label{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/">← 무스 테스트 등급표</a>
    <h1>오토뷰 등급 입력</h1>
    <p class="lede">영상에서 오토뷰가 매긴 <b>핸들링</b>과 <b>기본 안정성</b>(긴급 회피) 등급을 골라 주세요. 고르는 즉시 저장되고, 등급표를 갱신할 때 같은 칸 1위 차와 비교해 파란색으로 표시돼요. 링크의 시각은 영상 설명란 목차의 '핸들링'·'기본 안정성' 구간이에요. 한 영상에 차가 두 대면 나눠서 따로 입력해요.</p>
    <div class="scale" aria-label="등급 순서"><span>나쁨</span><span>부족</span><span>보통</span><span>좋음</span><span>훌륭함</span><span>+ 사이 값</span></div>
  </header>

  <section class="gate" id="gate" hidden>
    <b>관리자 키를 입력해 주세요</b>
    <form id="gateForm"><input type="password" id="key" autocomplete="current-password" placeholder="관리자 키" aria-label="관리자 키"><button>열기</button></form>
    <p class="err" id="gateErr"></p>
  </section>

  <div id="main" hidden>
    <div class="bar">
      <input type="search" id="q" placeholder="차 이름으로 찾기 (예: 모델 Y, 911, 마칸)" aria-label="차 이름으로 찾기">
      <label><input type="checkbox" id="onlyHint"> KM77 기록 있는 차만</label>
      <label><input type="checkbox" id="onlyTodo"> 미입력만</label>
      <span class="status" id="status"></span>
      <span class="count" id="count"></span>
    </div>
    <ul class="list" id="list"></ul>
  </div>
</div>

lassic 72km/h (기준 미달)"},{"key":"7zUwU8snQTc","vid":"7zUwU8snQTc","car":"2025 렉서스 ES300h","title":"[리뷰] 2025 렉서스 ES300h / 오토뷰 로드테스트","date":"2024-07-06","handling":907,"stability":1256,"split":"","hint":""},{"key":"cHblZQGkdTM","vid":"cHblZQGkdTM","car":"2024 포르쉐 파나메라 4","title":"[리뷰] 2024 포르쉐 파나메라 4 (Porsche Panamera 4) / 오토뷰 로드테스트","date":"2024-06-29","handling":938,"stability":1411,"split":"","hint":""},{"key":"-3IwMhyj25E","vid":"-3IwMhyj25E","car":"2024 르노 아르카나 하이브리드","title":"[4K 버전 - 재업로드] 동급 최저가격... 2024 르노 아르카나 하이브리드 리뷰 / 오토뷰 로드테스트","date":"2024-06-20","handling":null,"stability":956,"split":"","hint":""},{"key":"Defo0UxqXnQ","vid":"Defo0UxqXnQ","car":"2024 BMW 530e (PHEV)","title":"[리뷰] 2024 BMW 530e (PHEV) / 오토뷰 로드테스트","date":"2024-06-15","handling":779,"stability":1070,"split":"","hint":""},{"key":"97GNcj4P2nw","vid":"97GNcj4P2nw","car":"2024 기아 K9 3.8 AWD","title":"[리뷰] 2024 기아 K9 3.8 AWD / 오토뷰 로드테스트 - KIA K900 Roadtest","date":"2024-05-29","handling":1059,"stability":1484,"split":"","hint":""},{"key":"uqoTmyavBP0","vid":"uqoTmyavBP0","car":"2024 혼다 어코드 하이브리드","title":"[리뷰]  2024 혼다 어코드 하이브리드 / 오토뷰 로드테스트","date":"2024-05-18","handling":855,"stability":1265,"split":"","hint":""}];
const LEVELS = ["","나쁨","나쁨~부족","부족","부족~보통","보통","보통~좋음","좋음","좋음~훌륭함","훌륭함"];
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const KEY_NAME = 'moose-admin-key';
const keyStore = {
  get() { try { return localStorage.getItem(KEY_NAME) || ''; } catch { return ''; } },
  set(v) { try { v ? localStorage.setItem(KEY_NAME, v) : localStorage.removeItem(KEY_NAME); } catch {} },
};
let adminKey = keyStore.get();
const ratings = {};

const $ = (s) => document.querySelector(s);
const fmt = (s) => (s == null ? null : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const api = (method, body) => fetch('/api/ratings', {
  method, cache: 'no-store',
  headers: { 'Content-Type': 'application/json', ...(adminKey ? { 'x-admin-key': adminKey } : {}) },
  body: body ? JSON.stringify(body) : undefined,
});
const complete = (r) => !!(r?.handling && r?.avoidance);

function count() {
  const done = ENTRIES.filter((v) => complete(ratings[v.key])).length;
  $('#count').textContent = `${$('#list').children.length}대 표시 · 입력 완료 ${done}/${ENTRIES.length}`;
}
function render() {
  const q = $('#q').value.trim().toLowerCase();
  const onlyHint = $('#onlyHint').checked, onlyTodo = $('#onlyTodo').checked;
  const rows = ENTRIES.filter((v) => (!q || (v.car + ' ' + v.title).toLowerCase().includes(q)) && (!onlyHint || v.hint) && (!onlyTodo || !complete(ratings[v.key])));
  $('#list').innerHTML = rows.map((v) => {
    const r = ratings[v.key] || {};
    const opt = (cur) => LEVELS.map((l) => `<option value="${l}"${l === (cur || '') ? ' selected' : ''}>${l || '— 선택 —'}</option>`).join('');
    const link = (t, label) => (t == null ? '' : `<a href="https://www.youtube.com/watch?v=${v.vid}&t=${t}s" target="_blank" rel="noopener">${label} ${fmt(t)}</a>`);
    return `<li class="row${r.handling || r.avoidance ? ' done' : ''}" data-key="${v.key}">
      <div><div class="t">${esc(v.car)}</div>${v.split ? `<div class="src">${esc(v.title)}</div>` : ''}
        <div class="meta"><span>${v.date || ''}</span><a href="https://www.youtube.com/watch?v=${v.vid}" target="_blank" rel="noopener">영상</a>${link(v.handling, '핸들링')}${link(v.stability, '기본 안정성')}${v.split ? `<span class="split">${esc(v.split)}</span>` : ''}${v.hint ? `<span class="hint">${esc(v.hint)}</span>` : ''}</div></div>
      <div class="pick">
        <label for="h-${v.key}">핸들링</label><select id="h-${v.key}" data-k="handling">${opt(r.handling)}</select>
        <label for="a-${v.key}">기본 안정성</label><select id="a-${v.key}" data-k="avoidance">${opt(r.avoidance)}</select>
        <span class="saved" id="s-${v.key}">${r.updatedAt ? '저장됨 ' + r.updatedAt.slice(0, 10) : ''}</span>
      </div></li>`;
  }).join('');
  count();
}

$('#list').addEventListener('change', async (e) => {
  const sel = e.target.closest('select');
  if (!sel) return;
  const row = sel.closest('.row'), key = row.dataset.key;
  const next = { handling: '', avoidance: '', ...(ratings[key] || {}), [sel.dataset.k]: sel.value, updatedAt: new Date().toISOString() };
  const note = document.getElementById('s-' + key);
  note.textContent = '저장 중…';
  try {
    const res = await api('POST', { key, handling: next.handling, avoidance: next.avoidance, updatedAt: next.updatedAt });
    if (res.status === 401) { note.textContent = '관리자 키가 맞지 않아요'; return; }
    if (!res.ok) throw new Error(String(res.status));
    ratings[key] = next;
    note.textContent = '저장됨';
    row.classList.toggle('done', !!(next.handling || next.avoidance));
    count();
  } catch {
    note.textContent = '저장하지 못했어요. 다시 골라 주세요';
  }
});
['#q', '#onlyHint', '#onlyTodo'].forEach((s) => $(s).addEventListener('input', render));

// true when the list could be shown (key accepted or local), false when the key was refused
async function openList() {
  let res = null;
  try { res = await api('GET'); } catch {}
  if (res?.status === 401) return false;
  $('#gate').hidden = true; $('#main').hidden = false;
  const st = $('#status');
  if (res?.ok) {
    Object.assign(ratings, (await res.json()).ratings);
    st.textContent = LOCAL ? '로컬 저장 (data/autoview_ratings.json)' : '저장소 연결됨';
  } else {
    st.textContent = '저장소에 연결할 수 없어요'; st.classList.add('off');
  }
  render();
  return true;
}
function showGate(msg) {
  $('#main').hidden = true; $('#gate').hidden = false;
  $('#gateErr').textContent = msg || '';
  $('#key').focus();
}
$('#gateForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  adminKey = $('#key').value.trim();
  if (!adminKey) return;
  if (await openList()) keyStore.set(adminKey);
  else showGate('관리자 키가 맞지 않아요');
});

(async () => {
  // one-time link /autoview#key=… stores the key on this device and drops it from the address bar
  const hashKey = new URLSearchParams(location.hash.slice(1)).get('key');
  if (hashKey) { adminKey = hashKey; history.replaceState(null, '', location.pathname); }
  if (!LOCAL && !adminKey) return showGate();
  if (await openList()) { if (hashKey) keyStore.set(hashKey); }
  else { keyStore.set(''); adminKey = ''; showGate('관리자 키가 맞지 않아요'); }
})();
</script>
</body>
